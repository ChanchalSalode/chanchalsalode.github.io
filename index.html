<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Chanchal Kumar Salode, PhD candidate in Operations Research at IIT Delhi. Large-scale optimization for freight and transportation networks: hub location, network protection, exact decomposition methods." />
<title>Chanchal Kumar Salode</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
/* ---------------------------------------------------------------
   Tokens. The light palette is defined in full on bare :root, then
   only redefined in the two dark blocks. Nothing gets its sole
   definition inside a media query, or the page renders one theme's
   text on the other theme's ground.
   --------------------------------------------------------------- */
:root {
  color-scheme: light;

  --paper:        #fbfaf7;   /* warm off-white, the page ground        */
  --surface:      #ffffff;   /* raised blocks, used sparingly          */
  --surface-alt:  #f3f1ea;   /* quiet fill for the awards grid         */
  --ink:          #12202b;   /* deep blue-black body text              */
  --ink-strong:   #08131b;   /* headings                               */
  --muted:        #5a6a70;   /* grey biased toward the teal accent     */
  --rule:         #e3ded3;   /* warm hairline                          */
  --accent:       #0f5c63;   /* deep teal                              */
  --accent-ink:   #0b464c;   /* accent text on paper, higher contrast  */
  --accent-soft:  #e4efed;   /* accent wash                            */
  --on-accent:    #ffffff;   /* text sitting on a filled accent block  */

  --measure: 68ch;
  --gutter: 24px;

  --step--1: 0.8125rem;
  --step-0:  1rem;
  --step-1:  1.1875rem;
  --step-2:  1.4375rem;
  --step-3:  1.875rem;
  --step-4:  2.75rem;

  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:  "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper:       #0f1518;
    --surface:     #161e22;
    --surface-alt: #18232a;
    --ink:         #e4e6e4;
    --ink-strong:  #f4f5f3;
    --muted:       #93a3a7;
    --rule:        #26333a;
    --accent:      #4fb3b0;
    --accent-ink:  #6fc9c5;
    --accent-soft: #14282b;
    --on-accent:   #08181a;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:       #0f1518;
  --surface:     #161e22;
  --surface-alt: #18232a;
  --ink:         #e4e6e4;
  --ink-strong:  #f4f5f3;
  --muted:       #93a3a7;
  --rule:        #26333a;
  --accent:      #4fb3b0;
  --accent-ink:  #6fc9c5;
  --accent-soft: #14282b;
  --on-accent:   #08181a;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; }

a {
  color: var(--accent-ink);
  text-decoration-color: var(--rule); /* fallback before color-mix */
  text-decoration-color: color-mix(in srgb, var(--accent-ink) 35%, transparent);
  text-underline-offset: 2px;
}
a:hover { text-decoration-color: currentColor; }
a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

/* ----- shell ----- */
.wrap {
  max-width: 940px;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

/* ---------------------------------------------------------------
   Masthead. The old page put a shadowed rounded card around every
   single block, which flattens the hierarchy: if everything is a
   raised object, nothing reads as more important than anything
   else. Here the masthead is set on the page ground and separated
   by a rule, and the card treatment is saved for the awards grid.
   --------------------------------------------------------------- */
.masthead {
  padding-block: clamp(32px, 6vw, 60px) 28px;
  border-bottom: 1px solid var(--rule);
}

.identity {
  display: grid;
  grid-template-columns: 112px 1fr;
  gap: 26px;
  align-items: start;
}

.portrait {
  width: 112px;
  height: 112px;
  border-radius: 3px;
  object-fit: cover;
  background: var(--surface-alt);
  filter: saturate(0.9);
}

.monogram {
  width: 112px;
  height: 112px;
  border-radius: 3px;
  display: none;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: var(--step-4);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.015em;
  color: var(--ink-strong);
  text-wrap: balance;
}

.role {
  margin: 6px 0 0;
  font-family: var(--mono);
  font-size: var(--step--1);
  letter-spacing: 0.02em;
  color: var(--muted);
}

.lede {
  max-width: var(--measure);
  margin: 18px 0 0;
  font-size: var(--step-1);
  line-height: 1.58;
}

.lede + .lede {
  margin-top: 12px;
  font-size: var(--step-0);
  color: var(--muted);
}

/* ----- fact strip ----- */
/* Four items in two columns, so the grid always fills. auto-fit was giving
   three across with the fourth stranded alone on its own row. */
.facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 2px 34px;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--rule);
  list-style: none;
  padding-inline-start: 0;
}
.facts div { padding-block: 5px; }
.facts dt {
  font-family: var(--mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.facts dd {
  margin: 1px 0 0;
  font-size: var(--step--1);
  line-height: 1.45;
}

/* ----- link row ----- */
.links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}
.links a {
  display: inline-block;
  padding: 5px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  background: var(--surface);
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.links a:hover {
  border-color: var(--accent);
  color: var(--accent-ink);
  background: var(--accent-soft);
}
/* The filled button takes its foreground from a token rather than from a
   literal, so it stays legible in both themes without a separate rule. */
.links a.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--on-accent);
}
.links a.primary:hover { filter: brightness(1.08); }

/* ----- sticky section nav ----- */
.sectionnav {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--paper); /* solid fallback where color-mix is unsupported */
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.sectionnav ul {
  display: flex;
  gap: 20px;
  margin: 0;
  padding: 0;
  list-style: none;
  overflow-x: auto;
  scrollbar-width: none;
}
.sectionnav ul::-webkit-scrollbar { display: none; }
.sectionnav a {
  display: block;
  padding: 11px 0;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  color: var(--muted);
  text-decoration: none;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.sectionnav a:hover { color: var(--accent-ink); border-bottom-color: var(--accent); }

/* ----- sections ----- */
section {
  padding-block: 40px;
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 60px;
}
section:last-of-type { border-bottom: 0; }

h2 {
  margin: 0 0 20px;
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--accent-ink);
}

h3 {
  margin: 26px 0 10px;
  font-family: var(--serif);
  font-size: var(--step-2);
  font-weight: 600;
  line-height: 1.25;
  color: var(--ink-strong);
  text-wrap: balance;
}
h3:first-of-type { margin-top: 0; }

h4 {
  margin: 22px 0 8px;
  font-family: var(--sans);
  font-size: var(--step--1);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

p { max-width: var(--measure); margin: 0 0 14px; }
p:last-child { margin-bottom: 0; }

/* ----- reference lists (publications, talks) ----- */
.refs {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.refs > li {
  max-width: var(--measure);
  padding-left: 16px;
  border-left: 2px solid var(--rule);
  font-size: var(--step-0);
  line-height: 1.55;
}
.refs > li.featured { border-left-color: var(--accent); }
.refs .me { font-weight: 700; color: var(--ink-strong); }
.refs cite { font-style: italic; }
.venue-tags {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-left: 4px;
  vertical-align: baseline;
}
.tag {
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.03em;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  white-space: nowrap;
}
.target {
  display: block;
  margin-top: 3px;
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.03em;
  color: var(--muted);
}

/* ----- interests ----- */
.interests {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 18px 0 0;
  padding: 0;
  list-style: none;
}
.interests li {
  padding: 4px 11px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  font-size: var(--step--1);
  background: var(--surface);
}

/* ---------------------------------------------------------------
   Awards. This is the one place the page uses a filled card, so
   the four results read as a distinct object rather than as more
   body copy. The placing is set in mono so the four align.
   --------------------------------------------------------------- */
.awards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr)); /* four items, two rows, no orphan */
  gap: 1px;
  margin: 0;
  padding: 0;
  list-style: none;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 4px;
  overflow: hidden;
}
.awards li {
  background: var(--surface-alt);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.placing {
  font-family: var(--mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-ink);
}
.awards .what { font-weight: 600; line-height: 1.35; color: var(--ink-strong); }
.awards .where { font-size: var(--step--1); color: var(--muted); }

/* ----- news ----- */
.news {
  columns: 2;
  column-gap: 40px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.news li {
  break-inside: avoid;
  margin-bottom: 14px;
  padding-left: 14px;
  border-left: 2px solid var(--rule);
  font-size: var(--step--1);
  line-height: 1.5;
}
.news .when {
  display: block;
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.03em;
  color: var(--muted);
}

/* ----- project ----- */
.project-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin: 0 0 12px;
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.03em;
  color: var(--muted);
}
.bullets {
  max-width: var(--measure);
  margin: 0;
  padding-left: 18px;
}
.bullets li { margin-bottom: 7px; }

/* ----- teaching ----- */
.courses {
  margin: 0;
  padding: 0;
  list-style: none;
  max-width: var(--measure);
}
.courses li {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
}
.courses li:last-child { border-bottom: 0; }
.courses .yr {
  font-family: var(--mono);
  font-size: var(--step--1);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex: none;
}

/* ----- footer ----- */
footer {
  padding-block: 32px 44px;
  font-size: var(--step--1);
  color: var(--muted);
}
footer p { max-width: var(--measure); }
.mailto { font-family: var(--mono); }

/* ----- theme toggle ----- */
.themetoggle {
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
}
.themetoggle:hover { color: var(--accent-ink); border-color: var(--accent); }

@media (max-width: 700px) {
  .identity { grid-template-columns: 84px 1fr; gap: 18px; }
  .portrait, .monogram { width: 84px; height: 84px; }
  .monogram { font-size: 1.4rem; }
  .news { columns: 1; }
  .facts { grid-template-columns: 1fr; }
  .awards { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<header class="masthead">
  <div class="wrap">
    <div class="identity">
      <img src="images/LinkedinPic.jpeg" alt="Chanchal Kumar Salode" class="portrait" id="portrait" />
      <div class="monogram" id="monogram" aria-hidden="true">CKS</div>
      <div>
        <h1>Chanchal
